[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "culin-etl"
version = "0.1.0"
description = "RecipeNLG → co-occurrence + ingredient→technique artifacts for CulinAI"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
flavor = ["networkx>=3.0", "pandas>=2.0", "numpy>=1.24"]

[project.scripts]
culin-build = "culin_etl.build:main"
culin-serve = "culin_etl.serve:main"

[tool.setuptools.packages.find]
include = ["culin_etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

services:
  db:
    image: postgres:16-alpine
    container_name: culin-postgres
    environment:
      POSTGRES_USER: culin
      POSTGRES_PASSWORD: culin
      POSTGRES_DB: culin
    ports:
      - "5432:5432"
    volumes:
      - culin_pgdata:/var/lib/postgresql/data
      - ./sql/001_palate.sql:/docker-entrypoint-initdb.d/001_palate.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culin -d culin"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  culin_pgdata:
